# Every value the interoperability harness uses, in one place.
#
# The harness drives the container engine rootlessly through a process wrapper this repository owns,
# and takes no container-orchestration test dependency. That is the same decision the sibling made
# about its own process harness, for the same two reasons: the harness is a thing every suite
# depends on behaving, so it should be code somebody here can read; and a test dependency that
# reaches a daemon socket brings an ambient requirement with it, which is the opposite of what a
# hermetic tier is for.

[engine]
executable = "podman"
reason = "Rootless by default and daemonless, so a tier needs no privileged socket and leaves nothing running as anybody but the person who started it."

[timing]
# One absolute deadline per start, polled at this interval. Nothing sleeps for a fixed span and
# nothing asserts how long something took: a suite that measured duration would fail on a loaded
# machine and pass on an idle one, which is a suite that reports the machine rather than the code.
#
# The deadline is five minutes because it has to cover the slowest thing any tier starts, which is
# an Adobe Experience Manager quickstart on a machine that is already running the rest of a gate.
# A deadline chosen for the fastest tier is one that reports the load rather than the product.
readiness_deadline_milliseconds = 300000

# What a published runtime is given, which is not what a quickstart needs. One deadline for both
# means the tier that starts in seconds waits out the tier that starts in minutes - and the tier
# that starts in minutes is licensed, so the gate never starts it at all. Measured on a runner: a
# whole public-tier class, container start and bundle install and its own tests and the stop, has a
# median of fifteen seconds and has never taken twenty-five. The six that failed spent five minutes
# each finding out they never would, which was half the hour the gate took.
#
# Ninety seconds is six times the slowest healthy start and a third of what those six cost.
published_runtime_readiness_deadline_milliseconds = 90000

# What a cluster is given, which is neither of the other two. It starts a document store and two
# runtimes that have to find it, agree on one repository and initialise it between them, and the
# cold one costs far more than the warm ones after it. Measured on sixteen cores while the rest of
# the suite ran: initialising Oak twice against a document store drove the load average past thirty
# with memory never short, and whole cluster classes took twenty seconds warm and a hundred and
# fifty-seven, a hundred and ninety-three and two hundred and sixteen cold. Ninety seconds is what
# one runtime needs and it cut every cold cluster off; this is what a cluster needs, which is the
# same as the ceiling and for its own reason rather than by inheriting it.
clustered_runtime_readiness_deadline_milliseconds = 300000
readiness_poll_interval_milliseconds = 500
stop_grace_milliseconds = 10000

[capture]
# Output goes to a file, bounded. Holding a container's output in memory is how a suite that was
# proving something about startup ends up proving something about the heap instead.
maximum_captured_bytes = 4194304
reason = "Four mebibytes is more than a startup produces and less than anything that would matter, and the bound is what stops a container that logs in a loop from deciding how this suite ends."

# Every container this harness labels, so the leak check can find what it started and nothing else.
[labels]
harness = "rs.slingshot.agent.interop"
reason = "A leak check that listed every container on the machine would fail on somebody else's work. This one lists only what this harness labelled."

# Which pinned image plays which part. The images themselves, with their digests, are in
# support/interop-images.toml: one file records what is pinned, and this one records what each
# pinned thing is for, so neither has to restate the other.
[roles]
document_store = "docker.io/library/mongo:7"
harness_probe = "docker.io/library/alpine:3"
reason = "The document store is what makes two nodes one repository. The probe is what the harness proves itself against, so that an assertion about a readiness deadline does not wait for somebody else's runtime to boot."

[disruption]
# Where a connection is severed, enumerated before the injector was written rather than discovered
# while writing it. The interesting case in a transport is neither success nor refusal: it is the
# one where a request left and the answer did not come back, because that is where a caller cannot
# tell whether the work ran.
#
# Severed with the linger interval at zero, which sends a reset rather than closing: an orderly
# close is something both sides can flush through and read to the end of, and what is being proved
# is what happens when nobody got an answer at all.
points = [
    "before_the_first_request_byte",
    "after_the_request_head",
    "after_the_body",
    "mid_response_head",
    "mid_response_body",
    "mid_stream",
    "mid_artifact_transfer",
    "mid_intake",
]
severance_chunk_bytes = 64
reason = "The chunk is small so a severance lands inside a head or a body rather than after a whole one. Sixty-four bytes is under any answer's head this product produces, which is what makes 'part way through' mean it."

[handover]
# Where work moves from one node to another, enumerated before anything was written to move it.
#
# An author on the row this product is built for is not one machine, so every one of these is a real
# moment rather than a hypothetical: a node is replaced during a deployment, an instance is scaled
# away, a machine is restarted. What is proved at each is always the same sentence — exactly one
# effect for every committed admission, including where it was the surviving node's recovery that
# delivered it.
#
# A node is killed rather than asked to stop. A handover that works only after a clean shutdown is
# a handover that does not work, because the shutdowns that matter are the ones nobody performed.
points = [
    "while_a_lease_is_held",
    "at_the_moment_a_lease_expires",
    "while_a_job_is_being_redelivered",
    "during_a_sweep",
    "during_a_generation_rotation",
]
reason = "Five moments a node can be taken away in, each one a gap the other node's recovery has to cross. They are named rather than numbered because a scenario reporting 'handover point three' tells nobody what broke."
