# Every artifact a release consists of, and what each one hashes to.
#
# A release is a claim: these bytes, built from this source, doing what this documentation says. The
# digests here are what makes the first part of that claim checkable by somebody who was not there -
# they rebuild from the same source and compare, and a difference is a real difference rather than
# an argument about build environments.
#
# The digests are recorded by the build command rather than written by hand, and they are empty
# until it has run. An empty digest is an honest not-yet-built; a digest somebody typed is a digest
# somebody typed.
#
# Every archive is deterministic, which is a property of how they are produced rather than a hope:
# entry order is fixed, every entry's timestamp is the one the source declares, and nothing
# environment-dependent goes in. The verification command rebuilds and compares entry by entry,
# reporting the first that differs - because "the archives differ" sends somebody to look at
# everything and "this entry differs" sends them to look at one thing.

[build]
command = "scripts/build_release_artifacts"
verify = "scripts/verify_release_artifacts"
reason = "Building and verifying are two commands because they are two acts: one produces bytes and one checks that producing them again produces the same bytes. A single command that did both would be a command that could only ever agree with itself."

[[artifact]]
name = "slingshot-agent-all"
kind = "container-package"
file = "all/target/slingshot-agent-all-0.1.0-SNAPSHOT.zip"
digest = ""
reason = "The one thing an operator installs. Everything else in this list is either inside it or is about it."

