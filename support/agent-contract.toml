# This side's own bounds.
#
# The event-stream session bound exists because an Adobe Experience Manager as a Cloud Service
# author sits behind a gateway that ends a long request whether or not it is still moving, and it
# serves from a bounded request-thread pool a held stream occupies. The transport contract gives
# the client a heartbeat timeout and a bounded retry policy; what it cannot give is a maximum
# session length, because that is a property of the server's environment. So the agent ends its own
# streams first, at a bound it declares, and the client's existing resumption path carries the
# subscription across.
#
# Every `maximum_caller_` bound is one caller's share of the total spelled the same way without it,
# so no client can spend the whole store on everybody's behalf. A share above its own total is a
# bound that never applies, and loading refuses one.
#
# The two execution bounds are this side's because they are not about storage at all. A command
# runs inside the request that submitted it, so an execution in flight is a request thread this
# agent is holding in somebody else's author - the resource whose exhaustion is indistinguishable,
# from outside, from an instance that has gone. A bound on what the store keeps with no bound on
# what it is doing is a bound on the wrong thing.
#
# The two error bounds are this side's, and are the client's committed error schema's own numbers,
# compared with it by a suite for the same reason as the identity bounds below.
#
# The three identity bounds are this side's for the same reason, and they are chosen rather than
# invented: the client's committed identity schemas state a maximum length for the wire name, for
# the semantic contract version, and for the selected environment revision, and these are those
# three numbers. A suite compares them with that
# schema, so the two halves cannot drift; nothing reads the schema at run time, because a bound read
# from a document at run time is a bound whoever sent the document could choose.
#
# The three document bounds are this side's because the client never needed them: it writes the
# documents this agent reads, and a writer bounds what it produces by producing it. A reader takes
# bytes somebody else chose, so it needs a depth past which it stops recursing, a member count past
# which one object stops growing, and a length past which one name or string stops being read - each
# enforced as the bytes arrive rather than once the document is in hand, which would be a bound on
# memory already spent.

[agent]
clock_skew_allowance_milliseconds = 5000
# How long a health check that does real work may hold its answer before doing it again. The
# continuation-authority check issues a token and validates it, which is a write and a read against
# the key ring; a dashboard and a monitor both polling is the ordinary case rather than the
# exception, and a check that repeated that work for every poll would be a load somebody installed
# on purpose. It reports when it last ran, so a held answer is never mistaken for a fresh one.
health_check_interval_milliseconds = 60000
maintenance_sweep_work_bound_rows = 1024
maximum_caller_concurrent_command_executions = 8
maximum_caller_concurrent_event_streams = 8
maximum_caller_current_generation_active_subscription_bytes = 1048576
maximum_caller_current_generation_active_subscription_rows = 256
maximum_caller_current_generation_artifact_bytes = 68719476736
maximum_caller_current_generation_artifact_rows = 8192
maximum_caller_current_generation_event_bytes = 4294967296
maximum_caller_current_generation_event_rows = 1048576
