maximum_caller_current_generation_snapshot_bytes = 4294967296
maximum_caller_current_generation_snapshot_rows = 4096
maximum_command_execution_milliseconds = 25000
maximum_concurrent_command_executions = 32
maximum_concurrent_event_streams = 64
# The most rows one console page carries. It is this side's own rather than either client
# contract's, because no client ever asks for it: a person reading a table is the only thing that
# reaches it, and a table nobody can scroll is a table nobody reads. A page past this is clamped
# rather than refused - a person who asked for more rows than one page carries has made no mistake
# worth an error message.
maximum_console_page_rows = 200
# The most one log message may be. Refused rather than truncated: half a log line is the half
# somebody quotes, and the missing half is reliably the interesting one.
maximum_log_message_bytes = 4096
maximum_agent_error_code_bytes = 64
maximum_agent_error_message_bytes = 4096
maximum_document_nesting_depth = 32
maximum_document_object_members = 1024
# Raised from sixty-five thousand to the largest string the command contract permits. An asset's
# encoded payload is a single string of up to maximum_inline_binary_encoded_bytes, and the client is
# entitled to send one: a document reader that stopped at the smaller number would refuse the whole
# submission before the command saw it, and the caller would be told their document was malformed
# rather than that their asset was too large. The bound still exists and is still enforced; it is
# now the size the protocol actually carries.
maximum_document_string_bytes = 699052
maximum_event_stream_session_milliseconds = 45000
maximum_request_body_bytes = 4194304
maximum_request_start_skew_milliseconds = 300000
maximum_selected_environment_revision_bytes = 256
platform_call_deadline_milliseconds = 10000
recovery_reconciliation_interval_milliseconds = 60000
recovery_undetermined_margin_milliseconds = 15000

# The [command] table is the client's own command contract, reproduced byte-equivalently
# from `schemas/command-contract-limits-1.json` in the sibling repository. It bounds what a
# command may be asked and what it may answer, which the transport contract does not speak about:
# transport bounds one exchange, these bound one command inside it. Nothing here may be edited to
# suit this side. A bound whose value differs from the client's is a protocol disagreement, and
# the two halves would then refuse each other's perfectly well-formed work.
#
# A key may appear in both [transport] and [command] with two values, because they bound two
# different things: the transport bound holds for an identifier travelling in an envelope, the
# command bound for the same identifier supplied as an argument. The stricter one is not chosen
# here; each is read where it applies.
