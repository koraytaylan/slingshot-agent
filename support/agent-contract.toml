# Every bound this agent is held to, in one place.
#
# The sibling repository learned this rule by breaking it: a limit written down twice is two things
# that can disagree quietly, for as long as nobody compares them. So a value this file declares is
# written down nowhere else in this repository, and the source policy refuses a constant named
# after one of these bounds anywhere but here.
#
# The [transport] table is the client's own contract, reproduced byte-equivalently from
# `policy/author-agent-transport-contract-1.json` in the sibling repository. Nothing here may
# differ from it by so much as one value; a check compares them name by name against the sibling's
# committed bytes carried in as a fixture. Where the client's own document declares one bound in
# both its limits and its formulas, it is carried here once, because a bound written down twice
# is the thing this file exists to prevent — and the check refuses the day the two disagree.
#
# The [agent] table is this side's own — the bounds the transport contract does not give, because
# they are properties of the server's environment rather than of the protocol. A bound the
# transport contract already carries is not repeated here; it is read from the transport table.
#
# `agent-contract.sha256` beside this file authenticates these bytes. The contract is not exposed
# at all until the digest matches, so a bound nobody can authenticate is a bound nobody can read.

[transport]
