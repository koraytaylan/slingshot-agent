# The one author instance a live verification may reach, and the acknowledgement that permits it.
#
# One run against one author is evidence about that author and about nothing else. Saying so in the
# report is what stops it being quoted later as evidence about a deployment row - and the matrix
# refuses to record it, so it cannot become one by accident.
#
# Reaching a real instance never happens by default. The command refuses before it reads a byte of
# this file unless the enabling flag is given, so a run against somebody's author is always a thing
# somebody typed.
#
# Only commands the registry classifies as replacing nothing are run, and the set comes from the
# registry rather than from a list here: a command reclassified later changes what runs without
# anybody editing this.

[instance]
address = ""
identity = ""
# Set by the operator who owns the instance, after reading what will be run against it. An instance
# nobody acknowledged is one somebody pointed a suite at.
acknowledged = false
acknowledgement_reference = ""
reason = "One instance, named by whoever owns it. An address in a configuration file is not permission, which is why the acknowledgement is a separate value that an operator sets."

[run]
enabling_flag = "--yes-run-against-a-real-author"
reason = "A flag rather than a default, and a long one rather than a short one, because the mistake this prevents is somebody running a command they meant to read about."

[report]
aggregation = "refused"
reason = "The report is an observation of one unattested instance. It names the instance's platform version and the exact commands, and the acceptance matrix refuses to take it as evidence for a deployment row - because one author is not a row, and the distance between the two is exactly what a matrix is for."
