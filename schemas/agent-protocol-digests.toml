# Every committed schema, the typed model it describes, and the digest of its bytes.
#
# The schemas exist so a second implementation has something to read. They are not loaded at run
# time and nothing validates against them: the typed model is the validator, and a second
# validator with different bounds is precisely the failure this plan was built to avoid. What
# keeps them honest is the check that reads this file rather than a habit.
#
# The digest of each schema is what a five-field identity's role-schema members are derived from,
# so a schema that changed without its digest changing would be a build advertising a contract it
# no longer holds.

