# Where a schema states a length and the model reads a bound, the two are the same number and
# this says which. A bound written into a schema and a bound read from the contract that drifted
# apart would be two implementations disagreeing about what fits.

[[bound]]
schema = "schemas/agent-protocol/common/error.json"
member = "code"
limit = "maximum_agent_error_code_bytes"

[[bound]]
schema = "schemas/agent-protocol/common/error.json"
member = "message"
limit = "maximum_agent_error_message_bytes"

[[bound]]
schema = "schemas/agent-protocol/identity/command-contract.json"
member = "command_wire_name"
limit = "maximum_command_wire_name_bytes"

[[bound]]
schema = "schemas/agent-protocol/identity/command-contract.json"
member = "command_semantic_contract_version"
limit = "maximum_command_semantic_contract_version_bytes"

[[bound]]
schema = "schemas/agent-protocol/identity/operation.json"
member = "selected_environment_revision"
limit = "maximum_selected_environment_revision_bytes"

