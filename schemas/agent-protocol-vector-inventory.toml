# Every document kind, and the rule that none of them may exist without a vector.
#
# A vector is what makes a disagreement between two implementations a failing test in whichever
# one changed, rather than a refused submission in production two weeks later. That only works if
# a document kind cannot exist without one, which is what this inventory is for: every kind here
# needs a vector that is accepted and a vector that is refused, and every bound a model reads
# needs one at the bound and one past it.

