# One built set, published to both targets, with one job saying what the bytes are.
#
# Built once rather than once per target. Two builds are two sets of bytes, and two sets of bytes
# published under one version is the disagreement nobody notices until somebody compares them - so
# the same artifacts go to both places and their digests are compared before either does.
#
# Held to the same policy the other two workflows are, with no exception for being a release. A
# release workflow is the one that runs with the most credentials and the one somebody is most
# tempted to make an exception for.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: the release to build
        required: true
        type: string
      publish:
        description: hand the built set to the registry, where it waits for a person to release it
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    name: build the release set
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: set up the declared runtime
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
          # Where the registry's own credentials are read from, by the names the publish step
          # gives them. The token itself is a secret and reaches only that step's environment.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: prepare the locked dependency cache
        run: scripts/prepare_locked_dependency_cache
      - name: verify the requested version matches the source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          declared_version="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')"
          test "$REQUESTED_VERSION" = "$declared_version"
      - name: refuse a release whose preconditions are unmet
        run: ./mvnw --offline --batch-mode --no-transfer-progress -Dmaven.repo.local=.dependency-cache -Dsurefire.failIfNoSpecifiedTests=false test -Dtest=PublicationAuthorityTest,CentralPrerequisitesTest -pl development -am
      - name: build the release artifacts
        run: scripts/build_release_artifacts
      - name: prove two builds of this source agree
        run: scripts/verify_release_artifacts
      - name: keep the built set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-set
          path: support/release-artifacts.toml

      # The key is the owner's and lives in this run and nowhere else. It is imported after the set
      # has been built and proved reproducible, so nothing is signed that was not first checked.
      - name: take up the signing key for this run
        env:
          SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long
      - name: sign the release assets
        if: ${{ !inputs.publish }}
        run: |
          gpg --batch --yes --armor --detach-sign \
            --local-user 17976C0C5A0EFC14CAF68B09902E9E9C0A9654AB \
            --output all/target/slingshot-agent-all-${{ inputs.version }}.zip.asc \
            all/target/slingshot-agent-all-${{ inputs.version }}.zip
          gpg --batch --yes --armor --detach-sign \
            --local-user 17976C0C5A0EFC14CAF68B09902E9E9C0A9654AB \
            --output core/target/slingshot-agent-core-${{ inputs.version }}.jar.asc \
            core/target/slingshot-agent-core-${{ inputs.version }}.jar
          gpg --batch --yes --armor --detach-sign \
            --local-user 17976C0C5A0EFC14CAF68B09902E9E9C0A9654AB \
            --output aem/target/slingshot-agent-aem-${{ inputs.version }}.jar.asc \
            aem/target/slingshot-agent-aem-${{ inputs.version }}.jar
      - name: hand the set to the registry
        if: ${{ inputs.publish }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: scripts/publish_release
      - name: keep the downloadable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: |
            all/target/slingshot-agent-all-${{ inputs.version }}.zip
            all/target/slingshot-agent-all-${{ inputs.version }}.bom.json
            all/target/slingshot-agent-all-${{ inputs.version }}.zip.asc
            core/target/slingshot-agent-core-${{ inputs.version }}.jar
            core/target/slingshot-agent-core-${{ inputs.version }}-sources.jar
            core/target/slingshot-agent-core-${{ inputs.version }}-javadoc.jar
            core/target/slingshot-agent-core-${{ inputs.version }}.jar.asc
            aem/target/slingshot-agent-aem-${{ inputs.version }}.jar
            aem/target/slingshot-agent-aem-${{ inputs.version }}-sources.jar
            aem/target/slingshot-agent-aem-${{ inputs.version }}-javadoc.jar
            aem/target/slingshot-agent-aem-${{ inputs.version }}.jar.asc

  attest:
    name: say what the bytes are
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The one job that holds this, and it holds no write access to anything it could be describing.
    permissions:
      attestations: write
      id-token: write
    steps:
      - name: take the built set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-set
          # Where the upload took it from. An artifact of one file carries that file alone, so
          # without this it lands beside the checkout and the subject path below names nothing.
          path: support
      - name: produce build provenance for every artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: support/release-artifacts.toml
