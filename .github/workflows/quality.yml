# The gate, run where everybody can see it, and nothing else.
#
# One step after checkout and setup, with no additional command and no option. A workflow that ran
# the gate and then a few more things would be a workflow whose result is not the gate's result, and
# the whole point of an argument-free gate is that it means the same thing everywhere.
name: quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Nothing at the workflow level. Every job declares what it needs, so a job added later starts from
# nothing rather than from whatever the workflow happened to grant.
# A push supersedes the one before it. Without this every push leaves an hour of runner time
# finishing an answer about a commit that is no longer the branch's head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    # The gate reaches its own test suite now that the preparations stop failing, and that suite
    # starts a container per interoperability scenario. Sixty minutes cancelled it mid-run.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The token this checkout used is not left on the runner. A later step that wanted it
          # would be a later step nobody granted it to.
          persist-credentials: false
      - name: set up the declared runtime
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - name: prepare the locked dependency cache
        run: scripts/prepare_locked_dependency_cache
      - name: prepare the pinned interoperability images
        run: scripts/prepare_interop_images
      - name: run the gate
        run: scripts/quality
