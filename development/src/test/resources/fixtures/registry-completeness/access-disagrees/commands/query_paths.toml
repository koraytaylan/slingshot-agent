result_schema_digest = "f4fce3d870747b7208a8d14081c00fac4724c129c1edcbd9ee9a6e06adca5691"
contract_limits_digest = "c7f1218d8f79f883959be6004b7936718e8f6f68c1f428c7b3bd2d63eb30eb27"
staging_bytes = 0
execution = "immediate"
