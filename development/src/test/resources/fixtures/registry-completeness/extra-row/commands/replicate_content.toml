[command]
wire_name = "replicate_content"
contract_version = "1.0.0"
access = "write"

# Not intrinsically idempotent: offering the same subtree twice queues it twice, so the caller
# supplies a key and this side answers the first attempt's own result to every resend of it.
operation_key = "required"

result_bytes = 16384
failure_categories = ["admission_budget_exceeded", "admission_outcome_unknown", "admission_rejected", "candidate_limit_exceeded", "source_access_denied", "source_not_found", "traversal_budget_exceeded"]
