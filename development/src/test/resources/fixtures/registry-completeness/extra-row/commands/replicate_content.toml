result_schema_digest = "a92460ba72215b7c0931be9cba38a6838cd01ae3a994bcbd7a572899e70cda85"
contract_limits_digest = "c1d75299a29c1f4ab3495e5fff3f04bf483475573582d2976cfdf018fe46c255"
staging_bytes = 0
execution = "immediate"
