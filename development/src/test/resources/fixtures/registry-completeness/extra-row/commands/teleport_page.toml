[command]
wire_name = "teleport_page"
contract_version = "0.0.0"
access = "write"

# Making the same page twice is not making it once, so the caller supplies a key and this side
# answers the first attempt"s own result to every resend of it.
operation_key = "required"

result_bytes = 16384
failure_categories = ["mutation_outcome_unknown", "parent_access_denied", "parent_not_found", "property_rejected", "repository_commit_failed", "target_already_exists", "template_invalid", "template_not_found"]
