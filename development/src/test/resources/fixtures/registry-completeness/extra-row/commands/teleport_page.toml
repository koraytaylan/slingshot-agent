result_schema_digest = "6e3b91dd58779ae10d9b9f9a26ab4c659de93ca1baa052b585a1242dbf4b90b3"
contract_limits_digest = "5b76d21b81c0379e9d9e30426c5aff7939321b9466af183753091af19939d222"
staging_bytes = 0
execution = "immediate"
