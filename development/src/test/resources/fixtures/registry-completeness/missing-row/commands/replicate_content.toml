result_schema_digest = "c53efd6323655eef1bdab5b788bdf37fbca7ba823d36fb9ae9c08c01921b7bb9"
contract_limits_digest = "5b76d21b81c0379e9d9e30426c5aff7939321b9466af183753091af19939d222"
staging_bytes = 0
execution = "immediate"
