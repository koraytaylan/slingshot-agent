[prefix]
path = "/bin/slingshot/agent"
reason = "Canonical fixture namespace."

[[route]]
name = "operation-lookup"
path = "/bin/slingshot/agent/snapshot"
method = "GET"
media_type = "application/json"
body_permitted = false
owning_plan = "0004"
reason = "The only declared destination."

[[alias]]
path = "/libs/slingshot/agent/operations"
canonical = "nonexistent-operation-lookup"
client_version = "0.0.0"
pending_correction = "LOOKUP_ROUTE in crates/client/src/routes.rs becomes the canonical path"
reason = "A misspelled destination must not pass merely because the alias path matches."
