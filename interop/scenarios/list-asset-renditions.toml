[scenario]
id = "list-asset-renditions"
kind = "command"
feature = "list_asset_renditions"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.ListAssetRenditionsScenario"
reason = "Where an asset's storage actually goes, on a running instance. What this proves that no unit suite can: that the command is registered on a real Sling runtime, that it issues no query because renditions are children of the asset a caller named, and that its declared result carries no member through which rendition bytes or a path to them could travel — an answer that carried the renditions would be the very thing it is measuring."
