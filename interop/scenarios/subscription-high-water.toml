[scenario]
id = "subscription-high-water"
kind = "route"
feature = "subscription-high-water"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.HighWaterScenario"
reason = "How far a subscription has been served, which is the number a reconnecting client does not have. On an instance where nobody has subscribed, what is proved is the shape of the answers: registered, refusing a caller nobody authenticated, answering a subscription nobody took as one nobody has, and refusing a body it cannot read."
