[scenario]
id = "intake-publication-crash"
kind = "property"
feature = "repository-layout"
tier = "a"
deployments = ["aem-cloud-service"]
runner = "rs.slingshot.agent.interop.harness.IntakePublicationCrashScenario"
reason = "The built intake and artifact store publish validated bytes and reservation ownership together. A test-only probe pauses before or after the actual publication save, kills the writer without graceful shutdown, and checks bytes, outstanding declarations, ownership and total/caller counters from a surviving DocumentNodeStore. One upload observed through Oak cluster recovery completes the intact promise; a duplicate cannot publish or charge again. This proves durability after repository recovery, not a bounded failover time."
