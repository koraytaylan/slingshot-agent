[scenario]
id = "delete-configuration"
kind = "command"
feature = "delete_open_service_gateway_initiative_configuration"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.DeleteConfigurationScenario"
reason = "A control a deployment may refuse outright, and the one whose effect an operator is least able to undo. What this proves that no unit suite can: that its row requires an operation key, that it declares the platform control's own unknown outcome, and that the write surface is reachable through the transport."
