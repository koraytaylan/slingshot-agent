[scenario]
id = "find-pages-containing-phrase"
kind = "command"
feature = "find_pages_containing_phrase"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.FindPagesContainingPhraseScenario"
reason = "Full-text search on a running instance, where an unbounded query does the most damage because the phrase comes from a caller who cannot know what it will match. What this proves that no unit suite can: that the command is registered on a real Sling runtime, and that the query it declares is one the committed coverage policy answers from an index rather than by walking somebody's author instance."
