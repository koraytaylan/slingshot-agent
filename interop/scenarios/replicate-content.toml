[scenario]
id = "replicate-content"
kind = "command"
feature = "replicate_content"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.ReplicateContentScenario"
reason = "The command that offers content to replication, on a running instance. What this proves that no unit suite can: that its row requires an operation key and a submission carrying none is refused before anything runs, that the row declares the admission's own unknown outcome and not the repository mutation's — so an offer nobody heard back about is not reported as a failure and this command is not held to a commit it does not owe — and that the surface is reachable through the transport at all."
