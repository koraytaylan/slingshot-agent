[scenario]
id = "find-assets-by-metadata"
kind = "command"
feature = "find_assets_by_metadata"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.FindAssetsByMetadataScenario"
reason = "The command most likely to be asked a question no index answers, on a running instance. Asset metadata is where a customer keeps arbitrary properties of their own, so this proves what a unit suite cannot: that the command is registered on a real Sling runtime, and that every property its closed predicate set allows is one the committed coverage policy records the platform's own asset index as covering on every supported deployment."
