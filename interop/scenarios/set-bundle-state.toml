[scenario]
id = "set-bundle-state"
kind = "command"
feature = "set_open_service_gateway_initiative_bundle_state"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.SetBundleStateScenario"
reason = "A control a deployment may refuse outright. What this proves that no unit suite can: that its row requires an operation key, that it declares the platform control's own unknown outcome rather than the repository mutation's — it owes no repository commit — and that the surface is reachable through the transport."
