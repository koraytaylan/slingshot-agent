[scenario]
id = "privilege-escalation"
kind = "property"
feature = "repository-access"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.PrivilegeEscalationScenario"
reason = "On a running instance with provisioned state, authenticated ungranted and anonymous callers cannot read the tested raw repository path spellings. Populated key-ring storage is unreadable to them and an ungranted write leaves its contents unchanged. The administrator verifies fixture presence. StateAccessOwnershipScenario separately proves original caller content permissions and agent-route ownership despite explicit repository read grants."
