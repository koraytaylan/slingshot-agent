[scenario]
id = "console-artifact"
kind = "property"
feature = "agent-routes"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.ConsoleArtifactScenario"
reason = "The console offers exactly what a client is offered and nothing more: the same route, deciding who may fetch what, reporting the count and digest a downloader verifies for themselves. What this proves that no unit suite can is that the route a real instance serves is the one the console links to."
