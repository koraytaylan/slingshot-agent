[scenario]
id = "injection"
kind = "property"
feature = "injection-corpus"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.InjectionScenario"
reason = "Every value a caller supplies eventually becomes part of an address or a repository name, and the same three characters mean different things in each. What this proves that no unit suite can is that a real resolver and a real repository agree with this build about where a value points, including through encoded and doubly-encoded separators - because a check that disagrees with the resolver about where a path points is a check about a different path."
