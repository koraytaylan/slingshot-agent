[scenario]
id = "route-reachability"
kind = "route"
feature = "capabilities"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.RouteReachabilityScenario"
reason = "Sling reaches a path-bound servlet through a selector, an extension, a suffix, and a trailing segment, and a rule about that behaviour tested only against a model of the platform is a rule about the model. This asks a running instance for every one of those spellings and requires the refusal to come back."
