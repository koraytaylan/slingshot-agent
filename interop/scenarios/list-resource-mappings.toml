[scenario]
id = "list-resource-mappings"
kind = "command"
feature = "list_resource_mappings"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.ListResourceMappingsScenario"
reason = "The resolution rules themselves, on a running instance. What this proves that no unit suite can: that the command is registered on a real Sling runtime, that its argument takes a window and no filter — a partial view of rules that interact is a misleading one — and that the redaction corpus finds nothing anywhere in what it answers, because a mapping address can carry a credential and this listing removes it rather than masking it."
