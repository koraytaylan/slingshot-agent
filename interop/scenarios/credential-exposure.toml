[scenario]
id = "credential-exposure"
kind = "property"
feature = "redaction-corpus"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.CredentialExposureScenario"
reason = "Two audits already cover the two places anybody thinks of. What this proves that no unit suite can is that nothing planted reaches a log line, an event, a stored artifact, or a property this agent wrote on a running instance - the four places a value leaves without anybody watching - and that the key ring is absent from every one of them under every request, including under every failure."
