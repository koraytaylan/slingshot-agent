[scenario]
id = "submission"
kind = "route"
feature = "submit"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.SubmissionScenario"
reason = "The submission route on a running public instance proves registration, authentication, media-type and authorization refusals. An authenticated bounded query built from the installed agent's advertised contract and its identical resend prove that accepted responses carry only fixed numeric timing metrics, that timing is owned by each request, and that a terminal resend reports zero command execution and persistence without changing the durable acknowledgement. Snapshots prove one successful execution and an unchanged stored outcome after the resend."
