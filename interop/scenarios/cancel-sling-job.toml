[scenario]
id = "cancel-sling-job"
kind = "command"
feature = "cancel_sling_job"
tier = "a"
deployments = ["aem-cloud-service", "aem-6-5-lts"]
runner = "rs.slingshot.agent.interop.tier.CancelSlingJobScenario"
reason = "The control with the least reversible effect in this plan: a cancelled job is work that will now never happen and nothing remembers what it was going to do. What this proves that no unit suite can: that its row requires an operation key, that it declares the platform control's own unknown outcome, and that the surface is reachable through the transport."
