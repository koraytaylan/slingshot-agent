[command]
wire_name = "flush_replication_queue"
contract_version = "0.0.0"
access = "write"

# Not intrinsically idempotent: emptying a queue discards work somebody expected to happen, so the
# caller supplies a key and this side answers the first attempt's own result to every resend of it.
operation_key = "required"

result_bytes = 16384
failure_categories = ["agent_access_denied", "agent_not_found", "platform_control_outcome_unknown", "platform_control_rejected", "queue_expectation_mismatch"]
