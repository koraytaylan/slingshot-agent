[command]
wire_name = "cancel_sling_job"
contract_version = "1.0.0"
access = "write"

# Not intrinsically idempotent: a cancelled job is work that will now never happen, so the caller
# supplies a key and this side answers the first attempt's own result to every resend of it.
operation_key = "required"

result_bytes = 16384
failure_categories = ["job_not_cancellable", "job_not_found", "platform_control_outcome_unknown", "platform_control_rejected"]
argument_schema_digest = "60f397b89b51cd96817529b87e6294da9dd81cf086e5216094860a4aa8e9d0ca"
result_schema_digest = "00d25b3327aef42a588d8e7101d557a6c8fb6c9ba4c12351db401b8395dbec48"
contract_limits_digest = "c1d75299a29c1f4ab3495e5fff3f04bf483475573582d2976cfdf018fe46c255"
staging_bytes = 0
execution = "immediate"
