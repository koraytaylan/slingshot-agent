[command]
wire_name = "cancel_sling_job"
contract_version = "0.0.0"
access = "write"

# Not intrinsically idempotent: a cancelled job is work that will now never happen, so the caller
# supplies a key and this side answers the first attempt's own result to every resend of it.
operation_key = "required"

result_bytes = 16384
failure_categories = ["job_not_cancellable", "job_not_found", "platform_control_outcome_unknown", "platform_control_rejected"]
argument_schema_digest = "c4bd5fee1b135c698c0373e9708e6ed1a70bfce81955ca7db994083ca50a4676"
result_schema_digest = "89cc5bc701769d281d01261244dd9830912c35345e947fe36473f88d014f370b"
contract_limits_digest = "fe98b915cb84f787a5c54f8fab2e1408e108524e2765e96c9877cd236451da78"
staging_bytes = 0
execution = "immediate"
