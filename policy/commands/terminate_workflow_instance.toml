result_schema_digest = "d875d5c6da0dc1801ddf7f8ad29834ab069bdecd95606820a9d9ebdae8445b8a"
contract_limits_digest = "5b76d21b81c0379e9d9e30426c5aff7939321b9466af183753091af19939d222"
staging_bytes = 0
execution = "immediate"
