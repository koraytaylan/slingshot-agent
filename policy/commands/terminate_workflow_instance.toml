[command]
wire_name = "terminate_workflow_instance"
contract_version = "0.0.0"
access = "write"

# Not intrinsically idempotent: starting the same workflow twice is not starting it once, so the
# caller supplies a key and this side answers the first attempt's own result to every resend of it.
operation_key = "required"

result_bytes = 16384
failure_categories = ["instance_access_denied", "instance_not_found", "instance_not_terminable", "platform_control_outcome_unknown", "platform_control_rejected"]
argument_schema_digest = "e64690fd6d040c745a248205750e4d589eea406ca41d5a6ffdaa327579c062a1"
result_schema_digest = "d13550d857137cb9bb67191c1129d2d77db4490e22a8d1ac1adecce6826569d5"
contract_limits_digest = "5afebb38aab4322731e6872e02fadb111beb61ee457976b4e573f891943452c9"
staging_bytes = 0
execution = "immediate"
