result_schema_digest = "2f3cebcd7191f91a81600150181b58b5909efbdc93657819d91be541ca96ebcd"
contract_limits_digest = "10a708a6b720a2b70ed150fb5c0bbf063ea8c235a4395cffe51d92d9c2193ecd"
staging_bytes = 0
execution = "immediate"
