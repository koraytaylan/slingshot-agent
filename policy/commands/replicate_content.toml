result_schema_digest = "3baffe744b36ba5920e6af116fb30ed233d711b9380421ece6c9db6d5991f3b3"
contract_limits_digest = "c1d75299a29c1f4ab3495e5fff3f04bf483475573582d2976cfdf018fe46c255"
staging_bytes = 0
execution = "immediate"
