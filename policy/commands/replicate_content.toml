result_schema_digest = "cbf6e451ce50b1e76bb23dfb86888ce423c05bf6aeefdd28fcc29f39743803d3"
contract_limits_digest = "5afebb38aab4322731e6872e02fadb111beb61ee457976b4e573f891943452c9"
staging_bytes = 0
execution = "immediate"
