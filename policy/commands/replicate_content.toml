result_schema_digest = "f8a8af56befbd3d6ebe200f29d6a34f9f88bd4e2b466f13faa845cf2101fa62e"
contract_limits_digest = "fe98b915cb84f787a5c54f8fab2e1408e108524e2765e96c9877cd236451da78"
staging_bytes = 0
execution = "immediate"
