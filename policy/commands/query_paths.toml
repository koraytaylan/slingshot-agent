result_schema_digest = "a74b18a2f757f4e1b68527138c2b685bc28090595fa0b7a8f3e85d2e2f22bb57"
contract_limits_digest = "10a708a6b720a2b70ed150fb5c0bbf063ea8c235a4395cffe51d92d9c2193ecd"
staging_bytes = 0
execution = "immediate"
