[command]
wire_name = "query_paths"
contract_version = "0.0.0"
access = "read"

# The client classifies this command as intrinsically idempotent: asking the same subtree for the
# same type twice is asking once, so a key would decide nothing and is refused. The command beside
# it in this package requires one, which is why the rule is read from the client rather than
# derived from the fact that both are reads.
operation_key = "refused"

result_bytes = 1048576
failure_categories = ["continuation_token_expired", "continuation_token_integrity_invalid", "continuation_token_malformed", "continuation_token_wrong_query", "continuation_token_wrong_target", "discovery_budget_exceeded", "root_access_denied", "root_not_found"]
