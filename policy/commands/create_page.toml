result_schema_digest = "5a6a255d4224482593117ef7e1b974cce17ec2ecd28c145322dc57932ad14875"
contract_limits_digest = "fe98b915cb84f787a5c54f8fab2e1408e108524e2765e96c9877cd236451da78"
staging_bytes = 0
execution = "immediate"
