result_schema_digest = "205b50c047343d96edb58543f51e2921b12faba422b6f9e478941d56b882dd9a"
contract_limits_digest = "c1d75299a29c1f4ab3495e5fff3f04bf483475573582d2976cfdf018fe46c255"
staging_bytes = 0
execution = "immediate"
