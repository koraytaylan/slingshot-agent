result_schema_digest = "d45216a7a0ba3c327253ed67cd6fb25a057a7856375e60720ace416b824685cc"
contract_limits_digest = "5afebb38aab4322731e6872e02fadb111beb61ee457976b4e573f891943452c9"
staging_bytes = 0
execution = "immediate"
