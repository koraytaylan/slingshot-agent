result_schema_digest = "cd66c2d7e4ab0016110e29948d13ee9ea2a9759c5e28e2d68a548b5f128c438e"
contract_limits_digest = "10a708a6b720a2b70ed150fb5c0bbf063ea8c235a4395cffe51d92d9c2193ecd"
staging_bytes = 0
execution = "immediate"
