result_schema_digest = "95a5fc485f27420457492244d5ef7385ed9281c071a7a491b7c54a5253f8c5fb"
contract_limits_digest = "c1d75299a29c1f4ab3495e5fff3f04bf483475573582d2976cfdf018fe46c255"
staging_bytes = 0
execution = "immediate"
