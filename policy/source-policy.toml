# The rules about this repository's source that no off-the-shelf analyser has.
#
# Every falsifiable rule the source policy decides reads its values from here, so a limit exists
# once. What it cannot decide is a review checklist at the end of this file rather than a rule it
# pretends to have.
#
# The complexity and nesting ceilings are deliberately not here. They belong to the method-shape
# policy, and a value declared in two policies is exactly the defect this repository refuses.

format = "slingshot.agent.source-policy/1"

[limits]
# The largest physical line count of any repository-owned code file, whether Java, a build
# manifest, a policy document, or an executable script.
maximum_code_file_lines = 1000

# The smallest numeric literal the checker attributes meaning to. Zero and one are intrinsic
# identity and index values and carry no operational meaning. A literal that is already data with a
# name - the initialiser of a named constant, an enumeration discriminant, an array literal, or an
# index position - is data laid out as data and is not examined.
smallest_meaningful_literal = 2

# The smallest contract bound the second-declaration rule compares a bare literal against. Below
# this a value is as likely to be a structural quantity - a bit width, a small count, a field
# position - as a restatement of a bound, and a rule that cannot tell those apart is a rule that
# reports the wrong thing. The named form of the rule carries no such threshold, and it is the form
# that catches a second declaration somebody actually meant: a constant named after a bound. The
# threshold is not the only guard: see [[bounding_word]] below for which literals the value form
# examines at all, which is the other half of telling a restatement from a coincidence.
second_declaration_minimum_value = 1000

[contract]
# The package that owns the agent contract. Everywhere else asks it for a bound by name; a constant
# named after one, or a literal equal to one, is a second declaration that can drift quietly.
owning_package = "rs.slingshot.agent.contract"
document = "support/agent-contract.toml"

# Symbols this repository refuses anywhere, each with the reason it is refused. A rule of this kind
# exists because the thing it refuses is attractive: nobody needs a rule against something nobody
# would reach for.
[[refused_symbol]]
symbol = "mix:atomicCounter"
reason = "Oak's atomic counter increments without a read-modify-write, which is exactly what accounting seems to want - but on a clustered document store its increments are consolidated by a background task, so the value a node reads back is eventually consistent rather than current. An admission decision taken on it is correct on one instance and quietly wrong on a cluster, which is the worst shape a defect can have: it passes on the tier and fails on the customer's author. Counting here is compare-and-set over declared shards instead."

[[refused_symbol]]
symbol = "oak:counter"
reason = "The property the same mixin maintains. Refusing the mixin and not the property it writes would leave the one spelling somebody reaches for when the other is refused."

# Directories the scan does not enter, each with a reason.
[[excluded_directory]]
path = "docs/plans"
reason = "Planning prose is intentionally prospective and is a Makina input rather than source this product ships."

[[excluded_directory]]
path = "target"
reason = "Build output is not repository-owned source."

[[excluded_directory]]
path = ".git"
reason = "Version-control state is not repository-owned source."

[[excluded_directory]]
path = "fixtures"
reason = "A fixture is a deliberately broken sample the checker is proved against rather than source it governs."

# Names this repository does not get to choose. Each is a spelling the language or the platform
# dictates, and a name that has to be spelled a particular way to work at all is not a name somebody
# shortened. The exemption covers the exact spelling and nothing else.
[[dictated_name]]
name = "serialVersionUID"
dictated_by = "the Java platform's own serialisation contract"
reason = "The runtime looks for this exact field by this exact name. Spelling it in full would leave a servlet without the version marker every servlet is required to carry."

# What this checker deliberately does not decide. Each entry is a question a reader answers, and an
# assertion refuses a checker that so much as restates one of them as a rule - because restating a
# question reads as a claim to have answered it.
[[review_question]]
question = "Whether a name that spells its words in full is the right name for what it holds."
reason = "Spelling is structural and decidable; aptness is a judgement about the domain."

[[review_question]]
question = "Whether a named constant's name describes the quantity rather than the place it is used."
reason = "That a value carries a name is decidable; that the name explains the value is not."

[[review_question]]
question = "Whether a file under the line ceiling holds one subject or several."
reason = "A line count is a proxy. Whether the file is about one thing is a reader's judgement."

[[review_question]]
question = "Whether a value read from the contract is the right bound for what the code does with it."
reason = "That a bound is read rather than restated is decidable; that it is the correct bound is a design question."

# Where a command's own code lives, and what it may not reach from there.
#
# The agent's bookkeeping runs as a service user; everything a handler touches is decided by the
# caller's own repository access. That is the difference between an agent and a privilege
# escalation, and it holds only if obtaining a session is unavailable rather than discouraged — so
# the forms that would obtain one are refused by parsing rather than by review.
#
# Named in a comment is not reaching for one. A rule that could not tell those apart would be a rule
# that stopped people explaining why the thing is refused.
[handlers]
package = "rs/slingshot/agent/command"
reason = "The framework's own package and every handler package under it. A handler is given a caller context and can obtain nothing itself; this is the rule that makes that a fact rather than an intention."

[[refused_in_handlers]]
symbol = "loginService"
reason = "The service-user login. A handler that obtained one would be running as this product rather than as its caller, which is the whole thing this design exists to avoid."

[[refused_in_handlers]]
symbol = "loginAdministrative"
reason = "The deprecated administrative login. It is refused for the same reason and separately, because the one somebody reaches for when the other is refused is the one nobody wrote a rule against."

[[refused_in_handlers]]
symbol = "getServiceResourceResolver"
reason = "The resolver factory's service login. Same power, different spelling."

[[refused_in_handlers]]
symbol = "BundleContext"
reason = "A bundle context is a way to reach every service in the framework, which is a way to reach a resolver factory. A handler that has one has everything."

[[refused_in_handlers]]
symbol = "FrameworkUtil"
reason = "The other way to a bundle context, from any class at all."

[[refused_in_handlers]]
symbol = "@Reference"
reason = "A declarative-services reference is a service a handler did not receive. Everything a handler may use arrives in its caller context, and a reference is how that stops being true one command at a time."

# Words that make a constant's name a statement that it holds a bound.
#
# The value form of the second-declaration rule compares a number against every bound the two
# client contracts declare, and between them they declare enough numbers that bare value equality
# stopped meaning much: every ordinary power of two from 4096 to 131072 is a bound, and so is 1000.
# A read buffer, a milliseconds-in-a-second conversion and a genuine restatement are then all the
# same number, and a rule calling all three a second declaration reports the wrong thing about the
# two that are not - the failure `second_declaration_minimum_value` was introduced to avoid, arriving
# by another door.
#
# So a number is examined where it could be stating a bound at all: written bare into an expression,
# where a reader has nothing but the digits, or held in a constant whose own name says it is a
# bound. A constant saying it is something else is taken at its word. What this gives up is a bound
# hidden behind a deliberately misleading name; what it keeps is every finding worth having, because
# the named form still catches a constant named after a bound and this form still catches a constant
# that calls itself a ceiling and carries one.
[[bounding_word]]
word = "maximum"
reason = "The word the contract's own bounds are spelled with, so a constant using it is claiming to hold one."

[[bounding_word]]
word = "minimum"
reason = "A floor is a bound in the other direction and drifts from the contract exactly as a ceiling does."

[[bounding_word]]
word = "ceiling"
reason = "The word somebody reaches for when they are restating a maximum without calling it one."

[[bounding_word]]
word = "floor"
reason = "The same reach, for a minimum."

[[bounding_word]]
word = "limit"
reason = "A limit is a bound under a shorter name, and the client's own contract uses it for several."

[[bounding_word]]
word = "bound"
reason = "The word this repository uses for the thing itself, so a constant carrying it is unambiguous."

[[bounding_word]]
word = "largest"
reason = "A maximum written in plain English rather than in the contract's spelling."

[[bounding_word]]
word = "smallest"
reason = "A minimum written the same way."

# How this repository writes a log line, and the three forms that would bypass it.
#
# An operator with a console row has to be able to find the logs, and an operator with a log line
# has to be able to find the console row. That works only while every line goes through one writer:
# the writer is where the operation identifier is attached and where the redaction corpus is
# applied, so a line written past it is a line that is findable by nobody and redacted by nothing.
#
# Three separate forms, because they are three different mistakes. Reaching for a logger directly is
# somebody who did not know; formatting a message is somebody who knew and wanted an easier call
# site; and interpolating something the corpus covers is the one that actually leaks. Naming any of
# them in a comment is not doing them, so the rules read source with its comments removed.
[logging]
writer = "AgentLog"
package = "rs/slingshot/agent/log"
reason = "The one interface that writes a line, and the package it lives in — which is the only place the refused forms may appear, because that is where the writing actually happens."

[[refused_logger]]
symbol = "LoggerFactory"
reason = "The usual way to a logger. A class holding one writes lines the operation identifier never reaches and the corpus never sees."

[[refused_logger]]
symbol = "org.slf4j"
reason = "The import that makes the above possible, refused separately so a field declared by its fully qualified name is caught too."

[[refused_logger]]
symbol = "java.util.logging"
reason = "The platform's own logging, which is the thing somebody reaches for when the first two are refused."

[[refused_logger]]
symbol = "System.out"
reason = "The oldest one. It writes somewhere nobody is reading and carries nothing at all."

[[refused_log_form]]
form = "String.format"
reason = "A formatted message is a value somebody concatenated into text. The whole point of taking named fields is that a value stays a field, so the writer can withhold it and a reader can search for it."

[[refused_log_form]]
form = "{}"
reason = "The placeholder form of the same mistake, which looks structured and is not: what fills a placeholder is text by the time it reaches the line."

# Which clock a comparison is allowed to be made on, and what each is for.
#
# Every lease and every retention decision compares two instants, and the failure mode of a skewed
# clock is two nodes both believing they hold one lease. The property is always the same and never
# about accuracy: a decision may be conservative and may never be wrong.
#
# So the two sources have two purposes and neither may be used for the other's. A wall clock is what
# an instant that goes on the wire is read from, because a client comparing it with its own has to
# be comparing the same kind of thing - and it is corrected, which is why nothing measures a
# duration by subtracting two readings of it. A monotonic source is what every duration is measured
# on, and its value means nothing on its own, which is why no instant is ever read from it.
#
# The rule is that a duration is never derived from the wall clock outside the seam that reads it.
# Naming either source in a comment is not using it.
[clocks]
wall_clock = "System.currentTimeMillis"
monotonic = "System.nanoTime"
seam = "rs/slingshot/agent/stream"
reason = "The stream is the one place both sources are read, because it is the one place a bound on elapsed time and an instant on the wire meet. Everywhere else an instant arrives as an argument, which is what makes it testable at all."

[[duration_word]]
word = "elapsed"
reason = "The plainest name for the thing a monotonic source measures, and the one a wall-clock reading beside it is most obviously wrong for."

[[duration_word]]
word = "sinceUnix"
reason = "A duration written as a difference from an instant, which is the shape the mistake takes when somebody subtracts two wall-clock readings."

[[duration_word]]
word = "tookMilliseconds"
reason = "How long something took, which is a duration however it is spelled."
