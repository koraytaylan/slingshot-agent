# Every query this product issues, and the index each deployment row already provides for it.
#
# Adobe Experience Manager answers a query either from an index or by walking the repository, and
# an unbounded walk can exhaust the instance. Every repository query is declared as data and
# checked against the indexes below. Direct discovery uses bounded live cursors with explicit
# progress instead; query_paths version two does not issue a repository query. Those traversal
# limits are tested independently and are not proved by this index inventory.
#
# The two checks are different claims and both are needed. This file is what a deployment row was
# declared to provide; the plan is what the instance really has. A customer can remove an index, and
# a Cloud Service environment's index set is theirs to change — so the run-time check is the only
# version of this a customer's author is protected by, and a disagreement between the two is
# reported as itself rather than as a query defect.
#
# This product ships no index definition. A custom index lives outside /apps, changes the shape of
# somebody else's repository, and is an operator's decision rather than a side effect of installing
# an agent — so a command that would need one does not ship.

[coverage]
reason = "One row per query and one per index a deployment row provides, compared in both directions. A query no row covers fails the build naming the query and the deployment rows that cannot answer it."

# The indexes every supported deployment already provides, out of the box, with the properties each
# one covers. Nothing here is created by this product.

[[index]]
name = "nodetype"
deployment = "aem-cloud-service"
covers = ["jcr:primaryType"]
reason = "Oak's own node-type index, which every repository has. A query restricted to a primary type is answered from it."

[[index]]
name = "nodetype"
deployment = "aem-6-5-lts"
covers = ["jcr:primaryType"]
reason = "The same index on the other supported row."

[[index]]
name = "cqPageLucene"
deployment = "aem-cloud-service"
covers = ["jcr:primaryType", "jcr:content/cq:template", "jcr:content/jcr:title", "jcr:content/jcr:description"]
reason = "Adobe's own page index, provided by the product. Finding pages by template is answered from it where it indexes that property. An environment's copy is its operator's to change, and some do not index the template, so the template search reads the index's own definition before it names the index in its option clause, and walks within its budgets where the index cannot answer."

[[index]]
name = "cqPageLucene"
deployment = "aem-6-5-lts"
covers = ["jcr:primaryType", "jcr:content/cq:template", "jcr:content/jcr:title", "jcr:content/jcr:description"]
reason = "The same index on the other supported row."

[[index]]
name = "slingResourceType"
deployment = "aem-cloud-service"
covers = ["sling:resourceType"]
reason = "Adobe's own property index on the resource type, shipped with the product. Declared resource-type queries are checked against this row. The resumable page-component search walks scoped content directly and does not issue this query."

[[index]]
name = "slingResourceType"
deployment = "aem-6-5-lts"
covers = ["sling:resourceType"]
reason = "The same index on the other supported row."

[[index]]
name = "damAssetLucene"
deployment = "aem-cloud-service"
covers = ["jcr:primaryType", "jcr:content/metadata/dc:title", "jcr:content/metadata/dc:format", "jcr:content/metadata/dc:description"]
reason = "Adobe's own asset index. Finding assets by metadata is answered from it."

[[index]]
name = "damAssetLucene"
deployment = "aem-6-5-lts"
covers = ["jcr:primaryType", "jcr:content/metadata/dc:title", "jcr:content/metadata/dc:format", "jcr:content/metadata/dc:description"]
reason = "The same index on the other supported row."

# Every query a handler may issue. The list is empty until the first read command lands: a build
# with no commands issues no queries, and a check that refused that would be a check nobody could
# have written before the commands existed.

# Every query this product issues, written down before it is issued. A query that exists only as a
# string a handler builds is a query nobody can check against the indexes a deployment provides.

[[query]]
name = "find-pages-by-template"
roots = ["/content"]
properties = ["jcr:primaryType", "jcr:content/cq:template"]
issued_by = "find_pages_by_template"
reason = "Which pages use one template, under one subtree. The template property is one Adobe's own page index covers on every supported deployment, which is why this question has an answer that does not walk the repository — and the person asking it is about to change every page in the answer, so producing that list must not itself be the thing that takes the instance down."

[[query]]
name = "list-component-definitions"
roots = ["/apps", "/libs"]
properties = ["jcr:primaryType"]
issued_by = "list_component_definitions"
reason = "Component definitions under one anchor, found by the node type Oak's own node-type index covers. The resource type a definition resolves as is the remainder of its path, applied to the rows that index returns."

[[query]]
name = "list-components"
roots = ["/content"]
properties = ["sling:resourceType"]
issued_by = "list_components"
reason = "Component instances under one anchor, found by the resource type Adobe's own resource-type index covers. A node with no resource type is not a component, so the question does not walk every node to discover that."

[[query]]
name = "list-content-fragments"
roots = ["/content/dam"]
properties = ["jcr:primaryType"]
issued_by = "list_content_fragments"
reason = "Content fragments under one anchor, found by the asset node type Oak's own node-type index covers. The fragment flag that tells a fragment apart from every other asset is applied to the rows that index returns."

[[query]]
name = "list-experience-fragments"
roots = ["/content/experience-fragments"]
properties = ["jcr:primaryType"]
issued_by = "list_experience_fragments"
reason = "Experience fragments under one anchor, found by the page node type Oak's own node-type index covers. Which of those pages are fragments rather than variations is applied to the rows that index returns."

[[query]]
name = "list-page-templates"
roots = ["/conf"]
properties = ["jcr:primaryType"]
issued_by = "list_page_templates"
reason = "Editable page templates under one configuration, found by the node type Oak's own node-type index covers. The folder they sit in is applied to the rows that index returns, so the question does not walk the repository."

[[query]]
name = "list-content-fragment-models"
roots = ["/conf"]
properties = ["jcr:primaryType"]
issued_by = "list_content_fragment_models"
reason = "Content fragment models under one configuration, found by the node type Oak's own node-type index covers. Which of those nodes declare elements is applied to the rows that index returns."

[[query]]
name = "find-assets-by-metadata"
roots = ["/content/dam"]
properties = ["jcr:primaryType"]
issued_by = "find_assets_by_metadata"
reason = "Assets under one subtree, which the query finds by their node type alone and Adobe's own asset index answers. Every narrowing a caller sends — tags, media formats, a size range, and the shared property predicates — is a filter over the rows that query returned rather than part of it, bounded by the caller's examination budget. That split is what lets a caller ask about a property nobody indexed: the cost is one property read per candidate under the subtree they named, rather than a query no index covers."
