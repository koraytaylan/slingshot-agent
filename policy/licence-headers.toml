# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright 2026 Koray Taylan Davgana

# Which files carry a licence header, and exactly what it says.
#
# The two halves of one product being offered under different terms would be a defect nobody
# discovers until somebody tries to use both, so this repository reproduces the sibling's
# `MIT OR Apache-2.0` exactly, states it once in the aggregator, and carries the expression on every
# file it owns.
#
# The check parses each file rather than reading its first bytes. A header inside a string literal
# is not a header, and a file that mentions the expression in prose has not carried it.

[expression]
spdx = "MIT OR Apache-2.0"
copyright = "Copyright 2026 Koray Taylan Davgana"

# One row per kind of repository-owned file, naming the comment form its header is written in.
[[kind]]
name = "java"
suffix = ".java"
comment = "line"
prefix = "//"

[[kind]]
name = "xml"
suffix = ".xml"
comment = "xml"
prefix = "<!--"

[[kind]]
name = "toml"
suffix = ".toml"
comment = "hash"
prefix = "#"

[[kind]]
name = "shell"
suffix = ".sh"
comment = "hash"
prefix = "#"

[[kind]]
name = "properties"
suffix = ".properties"
comment = "hash"
prefix = "#"

# Paths the rule does not apply to. Each exclusion names a reason, and an exclusion with no reason
# is refused: a path nobody explained is a path somebody will quietly widen.
[[exclusion]]
path = "mvnw"
reason = "The Maven wrapper script is Apache Maven's own, committed unmodified. Rewriting its head would make it a file this repository maintains rather than one it pins."

[[exclusion]]
path = "mvnw.cmd"
reason = "The Maven wrapper script is Apache Maven's own, committed unmodified. Rewriting its head would make it a file this repository maintains rather than one it pins."

[[exclusion]]
path = ".mvn/wrapper/maven-wrapper.properties"
reason = "Generated by the Maven wrapper plugin and regenerated whenever the pinned version changes; a header here would be rewritten away by the tool that owns the file."

[[exclusion]]
path = "LICENSE"
reason = "A licence text carries its own terms and is reproduced unmodified apart from the copyright line."

[[exclusion]]
path = "LICENSE-MIT"
reason = "A licence text carries its own terms and is reproduced unmodified apart from the copyright line."

[[exclusion]]
path = "LICENSE-APACHE"
reason = "A licence text carries its own terms and is reproduced unmodified apart from the copyright line."

[[exclusion]]
path = "NOTICE"
reason = "The notice states the licensing of the built artifacts; carrying an expression inside it would restate the thing it exists to state."

[[exclusion]]
path = "src/test/resources/fixtures"
reason = "A fixture is written to be accepted or refused by exactly one rule. Carrying an unrelated header on it would make every fixture a place two rules meet, and one of them would eventually be the reason a fixture stopped proving what it was written for."

[[exclusion]]
path = "docs/plans"
reason = "Planning prose is a Makina input rather than a file this product ships, and its frontmatter contract is closed against additions."
