# The coverage floor, and what is excluded from it.
#
# A floor fails a build; a report produces a number. The difference is whether anybody acts on it,
# and the answer for a report is eventually no.
#
# Both measures are enforced independently and both are enforced per module and per class, because
# a module average hides a class nobody tested behind a class somebody tested twice.

[minimums]
# Written as whole percentages so the policy and the build state the same two values in the same
# form. The build reads them as ratios from the aggregator, and the check refuses the day the two
# disagree.
line_percent = 80
branch_percent = 70
reason = "Eighty and seventy are where a shortfall means a feature arrived with no scenario rather than a line that is hard to reach. They are the numbers a new command has to meet, and the interoperability-coverage gate is what decides whether the scenario proves anything."

# The modules the floor applies to. The two tooling modules are not among them: a floor on the
# coverage of the checks would be a floor on how thoroughly the gate tests itself, which the gate
# already answers by refusing a rule with no fixture.
[[measured_module]]
name = "core"
reason = "The Sling-only bundle is the product, and every claim this repository makes about the protocol is a claim about it."

[[measured_module]]
name = "aem"
reason = "The Adobe bundle is the product too, and the tier that observes it is the one that needs a licensed input, so its unit coverage carries more weight rather than less."

[[measured_module]]
name = "interop"
reason = "The harness the whole interoperability argument rests on is code somebody here wrote, and a defect in it would report success nothing earned."

# Nothing is excluded by default. Every exclusion names one class and the reason it is excluded; a
# package-level exclusion is refused outright, because excluding in bulk is how a floor stops
# meaning anything without anybody deciding that it should.

# Every exclusion names one class and why the gate cannot cover it. None of them is excluded for
# being hard to test: each belongs to a tier this gate is documented never to run, so the run that
# would cover it is a run that does not happen here.

[[exclusion]]
class = "rs.slingshot.agent.interop.tier.ClientTier"
reason = "Tier C, the sibling client end to end, which policy/quality-gate.toml marks run_by_the_gate = false because it needs an executable built from the sibling repository. What exercises this class is that tier."

[[exclusion]]
class = "rs.slingshot.agent.interop.tier.ClientTier.Ready"
reason = "The outcome tier C answers with, constructed only by a run of tier C."

[[exclusion]]
class = "rs.slingshot.agent.interop.tier.ClientTier.Refused"
reason = "The other outcome tier C answers with, constructed only by a run of tier C."

[[exclusion]]
class = "rs.slingshot.agent.interop.tier.LiveAuthorTier"
reason = "The tier that reaches somebody's own running author, which happens because a person asked for it and never because a gate ran. One run against one author is evidence about that author, which is why it is not part of any gate."

[[exclusion]]
class = "rs.slingshot.agent.interop.tier.LiveAuthorTier.Permitted"
reason = "The outcome that tier answers with when its holder has permitted the run, constructed only by a run against a real author."

[[exclusion]]
class = "rs.slingshot.agent.interop.tier.UpgradeTier.Pinned"
reason = "Constructed only when support/ names a previous release to upgrade from. Before the first release there is none, and the row that would populate it is the row this release writes."

[[exclusion]]
class = "rs.slingshot.agent.interop.harness.CrashInjector"
reason = "The injector reaches five declared handover points and the gate's cluster tier exercises one of them. The rest are reached by the licensed tiers. This is a real gap in what the gate proves rather than a class nobody can test, and it is recorded here rather than hidden by a lower floor."

[[exclusion]]
class = "rs.slingshot.agent.interop.harness.PlatformFaultInjector.Injection"
reason = "The record one fault injection is described by, populated by the platform faults only a licensed tier can cause."
